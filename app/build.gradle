plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nicenotify.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nicenotify.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // This app contains only Java code and Android framework APIs, so one APK
    // installs on both 32-bit and 64-bit ARM devices.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
